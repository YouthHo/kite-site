name: Deploy · Cloudflare Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Cloudflare Pages 项目名，未设置时默认取仓库名
      CF_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME || github.event.repository.name }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 检查凭据是否已配置
        id: guard
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ]; then
            echo "::notice::未配置 Cloudflare Secrets（CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID），跳过本次部署。"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: 安装 Node
        if: steps.guard.outputs.skip == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装依赖
        if: steps.guard.outputs.skip == 'false'
        run: npm ci

      - name: 构建（Cloudflare Pages 走根路径 base=/）
        if: steps.guard.outputs.skip == 'false'
        run: npm run build

      - name: 部署到 Cloudflare Pages
        if: steps.guard.outputs.skip == 'false'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ env.CF_PROJECT_NAME }} --branch=${{ github.ref_name }}
