<!DOCTYPE html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080808" />
    <script>
      // 首帧前应用主题，避免闪烁
      (function () {
        try {
          var t = localStorage.getItem('kite-theme') || 'dark'
          document.documentElement.setAttribute('data-theme', t)
        } catch (e) {}
      })()
    </script>
    <title>风筝 The Kite · 信仰至上 半生潜伏 — 2017 谍战剧专题站</title>
    <meta
      name="description"
      content="《风筝》柳云龙导演谍战剧专题站：人物档案、分集剧情、人物关系图谱、势力架构、历史背景、经典台词与名场面。信仰至上，半生潜伏。"
    />
    <meta
      name="keywords"
      content="风筝,柳云龙,罗海琼,李小冉,谍战剧,郑耀先,韩冰,风筝电视剧,The Kite"
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="风筝 The Kite · 信仰至上 半生潜伏" />
    <meta
      property="og:description"
      content="《风筝》(2017, 柳云龙执导) 影视资料专题站 — 人物 / 剧集 / 图谱 / 历史 / 台词。"
    />
    <meta property="og:image" content="{{SITE_URL}}/og-cover.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="{{SITE_URL}}/og-cover.png" />

    <!-- 字体已自托管（@fontsource，见 src/styles/fonts.scss），无外部请求 -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- 首屏关键样式内联：先铺黑底，避免白闪 -->
    <style>
      html, body { background: #080808; }
      #app { min-height: 100vh; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
